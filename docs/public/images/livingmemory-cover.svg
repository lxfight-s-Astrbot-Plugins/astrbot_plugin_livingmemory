<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">LivingMemory — memory, connected.</title>
  <desc id="desc">An editorial cover with a forest-green wordmark and a graph connecting preferences, people, plans and context.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#CAD5C8"/>
    </pattern>
  </defs>
  <rect width="1280" height="480" rx="24" fill="#F4F3EB"/>
  <rect x="656" y="24" width="600" height="432" rx="16" fill="#E7ECE3"/>

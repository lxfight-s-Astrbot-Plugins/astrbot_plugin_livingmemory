    <text x="120" y="69" fill="#52675C" font-size="13" font-weight="600" letter-spacing="2.2">LONG-TERM MEMORY FOR ASTRBOT</text>
    <text x="60" y="184" fill="#183E32" font-size="78" font-weight="700" letter-spacing="-4">LivingMemory</text>
    <text x="64" y="238" fill="#52675C" font-size="32" letter-spacing="-0.8">Memory, connected.</text>
    <path d="M64 278H596" stroke="#CBD3C7"/>
    <text x="64" y="321" fill="#52675C" font-size="17">A conversation becomes context.</text>
    <text x="64" y="349" fill="#52675C" font-size="17">Context becomes something worth remembering.</text>

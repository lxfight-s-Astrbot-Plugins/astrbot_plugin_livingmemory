name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout AstrBot
        uses: actions/checkout@v5
        with:
          repository: AstrBotDevs/AstrBot
          # 固定到本插件测试套件验证过的上游提交，避免上游 master 变动导致
          # 同一 commit 的 CI 结果不可复现。升级时先本地跑全量测试再更新此 sha。
          ref: a6265fa6c9471d499574c119edeba54a125db314
          path: AstrBot

      - name: Checkout LivingMemory
        uses: actions/checkout@v5
        with:
          path: AstrBot/data/plugins/astrbot_plugin_livingmemory

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            AstrBot/requirements.txt
            AstrBot/data/plugins/astrbot_plugin_livingmemory/requirements.txt
            AstrBot/data/plugins/astrbot_plugin_livingmemory/requirements-dev.txt

      # dashboard 资产检查用例需要 node；缺失时该用例会跳过，保持覆盖率不降。
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r AstrBot/requirements.txt
          python -m pip install -r AstrBot/data/plugins/astrbot_plugin_livingmemory/requirements.txt
          python -m pip install -r AstrBot/data/plugins/astrbot_plugin_livingmemory/requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: AstrBot/data/plugins/astrbot_plugin_livingmemory
        run: npm ci

      - name: Lint and format check
        working-directory: AstrBot/data/plugins/astrbot_plugin_livingmemory
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run test suite
        working-directory: AstrBot/data/plugins/astrbot_plugin_livingmemory
        run: python -m pytest -q

      # 召回排序/相关性门槛的离线回归门禁：合成数据 + 确定性 embedding，
      # 无网络、无 API 费用，基线见 tests/eval/baseline.json。
      - name: Run offline recall quality evaluation
        working-directory: AstrBot/data/plugins/astrbot_plugin_livingmemory
        run: python -m pytest -q -m eval

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout LivingMemory
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Check dashboard bundles
        run: node scripts/build_dashboard.mjs --check

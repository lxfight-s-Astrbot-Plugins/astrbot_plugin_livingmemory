name: Auto Release on Version Update

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'metadata.yaml'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
      old_version: ${{ steps.check.outputs.old_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check version change
        id: check
        run: |
          # 获取当前版本
          CURRENT_VERSION=$(grep '^version:' metadata.yaml | awk '{print $2}')
          echo "Current version: $CURRENT_VERSION"

          # 获取上一次提交的版本
          git checkout HEAD~1 -- metadata.yaml 2>/dev/null || echo "First commit"
          if [ -f metadata.yaml ]; then
            PREVIOUS_VERSION=$(grep '^version:' metadata.yaml | awk '{print $2}')
            git checkout HEAD -- metadata.yaml
          else
            PREVIOUS_VERSION="none"
          fi
          echo "Previous version: $PREVIOUS_VERSION"

          # 比较版本
          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "old_version=$PREVIOUS_VERSION" >> $GITHUB_OUTPUT
            echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No version change detected"
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        env:
          RELEASE_VERSION: ${{ needs.check-version.outputs.new_version }}
          PREVIOUS_VERSION: ${{ needs.check-version.outputs.old_version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          previous = os.environ["PREVIOUS_VERSION"]
          repository = os.environ["RELEASE_REPOSITORY"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if section is None:
              raise SystemExit(f"Missing CHANGELOG.md section for {version}")
          notes = f"## LivingMemory {version}\n\n" + section.group(1).strip()
          notes += (
              "\n\n---\n"
              f"**Full Changelog**: https://github.com/{repository}/compare/{previous}...{version}\n"
          )
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Determine prerelease
        id: prerelease
        run: |
          if echo "${{ needs.check-version.outputs.new_version }}" | grep -qiE "beta|alpha|rc|pre"; then
            echo "value=true" >> $GITHUB_OUTPUT
          else
            echo "value=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.new_version }}
          target_commitish: ${{ github.sha }}
          name: LivingMemory ${{ needs.check-version.outputs.new_version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.prerelease.outputs.value == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify release created
        run: |
          echo "Release ${{ needs.check-version.outputs.new_version }} has been created successfully."
          echo "View release at: https://github.com/${{ github.repository }}/releases/tag/${{ needs.check-version.outputs.new_version }}"
